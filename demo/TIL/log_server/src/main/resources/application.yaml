server:
  port: 8080

spring:
  profiles:
    active: no-queue
  mongodb:
    uri: mongodb://localhost:27017/sensordb
  data:
    redis:
      host: localhost
      port: 6379

mqtt:
  broker-url: tcp://localhost:1883
  client-id: sensor-consumer-1
  topic-filter: "sensor/+/+/data"   # sensor/{sensorType}/{deviceId}/data
  qos: 1

logging:
  level:
    org.eclipse.paho: DEBUG
    org.springframework.integration.mqtt: DEBUG
  file:
    name: logs/sensor-server.log